target-version = "py311"
line-length = 120
extend-exclude = ["extern_tools"]

[lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "FURB",
    "ISC",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "TID",
    "UP",
    "W",
]

ignore = [
    "A004",
    "E402",
    "E501",
    "PERF203",
    "PERF401",
    "PLC0415",
    "PLW0603",
    "PLW1510",
    "PLW2901",
    "RUF012",
    "SIM102",
    "SLF001",
    "TID252",
]

[lint.per-file-ignores]
"tools/register.py" = ["RUF063"]
