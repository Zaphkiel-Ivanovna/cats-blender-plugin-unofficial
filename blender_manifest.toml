schema_version = "1.0.0"

id = "cats_blender_plugin"
version = "1.0.1"
name = "Unoffical Cats Blender Plugin"
tagline = "Shortens the steps to import and optimize models for VRChat"
maintainer = "Zaphkiel-Ivanovna <59056390+Zaphkiel-Ivanovna@users.noreply.github.com>"
type = "add-on"
website = "https://github.com/Zaphkiel-Ivanovna/cats-blender-plugin-unofficial"
tags = ["3D View", "Modeling", "Mesh", "Object"]
blender_version_min = "5.0.0"
blender_version_max = "5.3.0"
license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Import and export model files, and cache translation data"
network = "Download translations and check for add-on updates"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "/*.zip",
  "*.blend[1-9]",
  "/docs/",
  "/tests/",
  "/extern_tools/google_trans_new/test.txt",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/ruff.toml",
]
