name: Run CATS-Blender-Plugin tests

on:
  push:
    branches: [ "main", "dev", "forked_dev" ]
  pull_request:
    branches: [ "main", "dev", "forked_dev" ]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with blender_version_min / blender_version_max in
        # blender_manifest.toml
        blender: ["5.0", "5.1"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blender ${{ matrix.blender }}
        run: |
          set -euo pipefail
          series="${{ matrix.blender }}"
          base="https://download.blender.org/release/Blender${series}"
          file=$(curl -sSL "$base/" \
            | grep -oE "blender-${series}\.[0-9]+-linux-x64\.tar\.xz" \
            | sort -V | tail -1)
          if [ -z "$file" ]; then
            echo "no linux-x64 build found for Blender $series" >&2
            exit 1
          fi
          echo "Using $file"
          curl -sSLo blender.tar.xz "$base/$file"
          mkdir -p "$HOME/blender"
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1
          "$HOME/blender/blender" --background --version

      - name: Run headless tests
        run: python3 tests/headless/run.py --blender "$HOME/blender/blender"
